name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  macos:
    name: Check and package macOS (arm64)
    runs-on: macos-15
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      MACOSX_DEPLOYMENT_TARGET: "13.0"

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: ${{ github.ref_type == 'tag' && '0' || '1' }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - name: Set up Rust
        run: rustup toolchain install 1.99.1 --profile minimal && rustup default 1.99.1
      - name: Check tag and extract release notes
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor HEAD origin/master
          mkdir -p target/dist
          scripts/release-notes.sh "$TAG" > target/dist/release-notes.md
      - name: Install brain dependencies
        working-directory: brain
        run: bun install --frozen-lockfile
      - name: Run repository checks
        env:
          INKLING_DATA_DIR: ${{ runner.temp }}/inkling-ci
        run: |
          scripts/dev check
          git diff --exit-code -- Cargo.lock brain/bun.lock
      - name: Build and verify install ZIP
        run: scripts/package.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        with:
          name: inkling-macos-arm64
          path: target/dist/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          overwrite: true
