<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Inkling · walkthrough film</title>
<!-- The film is one page. Every frame is renderAt(t), a pure function of time, so headless
     Chrome can render any frame in any order (render.ts splits the frames across workers).
     Open it in a browser to play it live: ?t=<seconds> holds one frame, ?play plays it. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,300..700,0..100,0..1;1,9..144,300..700,0..100,0..1&family=Figtree:ital,wght@0,400..700;1,400..700&display=block">
<style>
html, body { margin: 0; background: #111; }
* { box-sizing: border-box; }
/* No transitions or animations anywhere: time moves only through renderAt(t). */
*, *::before, *::after { transition: none !important; animation: none !important; }

#stage {
  position: relative; width: 1920px; height: 1080px; overflow: hidden;
  font-family: "Figtree", system-ui, sans-serif; color: var(--fg);
  -webkit-font-smoothing: antialiased; font-kerning: normal;
  background: var(--bg);
}
.serif { font-family: "Fraunces", Georgia, serif; font-variation-settings: "SOFT" 100, "WONK" 0; font-optical-sizing: auto; }
.tab { font-variant-numeric: tabular-nums; }

/* ---------- the desk: linen, the only textured surface ---------- */
#world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.desk { position: absolute; left: -4000px; top: -4000px; width: 9240px; height: 8780px; background-size: 48px 48px; }
#desk { background-color: var(--bg); background-image: var(--weave-l); }
#desk-dark { background-color: var(--bg); background-image: var(--weave-d); opacity: 0; }
#vignette { position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(120% 90% at 50% 45%, transparent 55%, rgba(var(--shadow), .10) 100%); }

/* ---------- the window ---------- */
.win { position: absolute; left: 0; top: 0; width: 1240px; height: 780px; border-radius: 12px; overflow: hidden;
  background: var(--surface); color: var(--fg);
  box-shadow: 0 0 0 1px rgba(var(--shadow), .14), 0 2px 6px rgba(var(--shadow), .06), 0 44px 80px -40px rgba(var(--shadow), .62); }
.tb { position: absolute; left: 0; top: 0; right: 0; height: 46px; background: var(--surface); border-bottom: 1px solid var(--line); }
.lights { position: absolute; left: 14px; top: 17px; display: flex; gap: 8px; }
.lights i { width: 12px; height: 12px; border-radius: 50%; background: #FF5F57; box-shadow: inset 0 0 0 .5px rgba(0,0,0,.18); }
.lights i:nth-child(2) { background: #FEBC2E; } .lights i:nth-child(3) { background: #28C840; }
.tb-menu { position: absolute; left: 84px; top: 13px; width: 20px; height: 20px; }
.tb-wm { position: absolute; left: 112px; top: 9px; height: 26px; }
.tb-wm svg, .wmsvg { height: 100%; width: auto; overflow: visible; display: block; }
.wm-ink { fill: var(--fg); } .wm-k { fill: var(--madder); }
.wm-khi { fill: color-mix(in srgb, var(--madder) 52%, #fff); } .wm-klo { fill: color-mix(in srgb, var(--madder) 70%, #000); }
.chat-btn { position: absolute; right: 14px; top: 11px; height: 24px; display: flex; align-items: center; gap: 6px; padding: 0 11px;
  border: 1px solid var(--line); border-radius: 999px; font-size: 12px; color: var(--fg); background: var(--surface); }
.chat-btn.on { border-color: var(--fg); }
.dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--madder); flex: none; }

.side { position: absolute; left: 0; top: 46px; width: 232px; bottom: 0; background: var(--shelf); border-right: 1px solid var(--line); padding: 14px 10px; font-size: 14px; }
.find { display: flex; align-items: center; justify-content: space-between; color: var(--fg3); background: var(--surface); border: 1px solid var(--line); border-radius: 7px; padding: 6px 8px; margin-bottom: 14px; font-size: 13px; }
kbd { font: 500 11px/1 "Figtree"; color: var(--fg3); border: 1px solid var(--line2); border-bottom-width: 2px; border-radius: 4px; padding: 2px 4px; background: var(--raised); }
.fold { color: var(--fg3); font-size: 12px; padding: 10px 8px 4px; }
.nt { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 6px; color: var(--fg2); white-space: nowrap; overflow: hidden; }
.nt span:first-child { overflow: hidden; text-overflow: ellipsis; }
.nt.cur { background: var(--surface); color: var(--fg); box-shadow: 0 0 0 1px var(--line); }
.nt .st-n { margin-left: auto; display: flex; align-items: center; gap: 4px; font-size: 12px; color: var(--fg3); }

.pagearea { position: absolute; left: 232px; top: 46px; right: 0; bottom: 0; overflow: hidden; }
.pagearea .desk { left: -2000px; top: -2000px; width: 5000px; height: 5000px; }
.sheet { position: absolute; left: 20px; top: 14px; width: 968px; bottom: -40px; background: var(--surface); border-radius: 6px 6px 0 0;
  box-shadow: 0 1px 0 rgba(var(--shadow), .05), 0 14px 30px -18px rgba(var(--shadow), .45); }

/* the note's header row: which mind, the brief, the mode, what is loose, hide threads */
.nh { position: absolute; left: 56px; right: 32px; top: 16px; height: 24px; display: flex; align-items: center; gap: 18px; font-size: 13px; color: var(--fg2); white-space: nowrap; }
.nh .mind { display: flex; align-items: center; gap: 6px; color: var(--fg); font-weight: 500; }
.nh .grow { flex: 1; }
.nh .it { display: flex; align-items: center; gap: 5px; }
.nh svg { width: 12px; height: 12px; flex: none; }
.nh .hov { border-radius: 5px; box-shadow: 0 0 0 4px var(--chip); background: var(--chip); }
.briefline { position: absolute; left: 56px; right: 32px; top: 46px; overflow: hidden; }
.briefline .bin { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--raised); font-size: 13.5px; color: var(--fg); height: 32px; }
.briefline .bset { display: flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--fg2); height: 32px; }
.briefline .bset b { font-weight: 500; color: var(--fg3); }
.briefline svg { width: 12px; height: 12px; flex: none; }

.vp { position: absolute; left: 0; right: 0; bottom: 0; overflow: hidden; -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 16px); mask-image: linear-gradient(to bottom, transparent 0, #000 16px); }
.content { position: absolute; left: 0; top: 0; width: 968px; height: 1400px; }
.band { position: absolute; left: 56px; top: 0; width: 880px; height: 26px; display: flex; align-items: center; gap: 10px; }
.band svg { flex: 1 1 0; min-width: 0; height: 24px; overflow: visible; }
.band .count { flex: none; font-size: 12px; color: var(--fg3); white-space: nowrap; min-width: 64px; text-align: right; }
.n-title { position: absolute; left: 56px; top: 40px; width: 560px; margin: 0; font-size: 30px; line-height: 36px; font-weight: 500; letter-spacing: -.01em; min-height: 36px;
  font-family: "Fraunces", Georgia, serif; font-variation-settings: "SOFT" 100, "WONK" 0, "opsz" 72; white-space: pre-wrap; }
.n-title.ph { color: var(--fg3); }
.rows { position: absolute; left: 0; top: 94px; display: grid; grid-template-columns: 56px 560px; row-gap: 14px; width: 616px; }
.para { margin: 0; font-size: 17px; line-height: 28px; min-height: 28px; white-space: pre-wrap; font-family: "Fraunces", Georgia, serif; font-variation-settings: "SOFT" 100, "WONK" 0; font-optical-sizing: auto; }
.gut { position: relative; height: 28px; }
.gut svg { position: absolute; overflow: visible; }
.gut .num { position: absolute; left: 50%; top: 19px; transform: translateX(-50%); font: 600 11px/1 "Figtree"; color: var(--fg3); }
.sel { background: var(--sel); border-radius: 2px; }
.anc.on { background: color-mix(in srgb, var(--madder) 9%, transparent); border-radius: 2px; }
.anc.sel { background: var(--sel); } /* a selection shows through the words a thread is on */
.cm { display: inline-block; width: 0; height: 1em; vertical-align: -0.12em; }
.caret { position: absolute; width: 1.6px; background: var(--fg); border-radius: 1px; display: none; }
.mg { position: absolute; left: 640px; top: 0; width: 296px; }
svg.ov { position: absolute; left: 0; top: 0; width: 968px; height: 1400px; overflow: visible; pointer-events: none; }

/* ---------- tags: woven labels stitched to the page (after src/note_page.rs `card`) ---------- */
.tag { position: absolute; left: 0; width: 296px; background: var(--raised); border-radius: 10px;
  box-shadow: 0 2px 8px rgba(var(--shadow), .14); font-size: 14.5px; line-height: 21px; color: var(--fg); }
.tag::before { content: ""; position: absolute; inset: 4px; border-radius: 7px; border: 1px dashed color-mix(in srgb, var(--tc) 42%, transparent); pointer-events: none; }
.tag .ring { position: absolute; left: -4px; top: 11px; width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid color-mix(in srgb, var(--tc) 90%, transparent); background: var(--raised); }
.tag .in { position: relative; padding: 9px 15px 13px; display: flex; flex-direction: column; gap: 8px; }
.tag .hd { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-left: 0; font-size: 12.5px; line-height: 16px; }
.tag .hd .who { display: flex; gap: 5px; align-items: center; min-width: 0; white-space: nowrap; overflow: hidden; }
.tag .hd b { font-weight: 600; color: var(--tc); }
.tag .hd .k { color: var(--fg3); overflow: hidden; text-overflow: ellipsis; }
.tag .hd .n { color: var(--fg3); }
.tag .m p { margin: 0; } .tag .m p + p { margin-top: 8px; }
.tag .you { display: flex; gap: 6px; font-size: 13.5px; line-height: 19px; color: var(--fg2); }
.tag .you span:first-child { color: var(--fg3); flex: none; }
.tag .wait { font-size: 13px; color: var(--fg3); }
.tag .short { font-size: 13px; line-height: 18px; color: var(--fg3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tag .think { display: flex; align-items: center; gap: 7px; font-size: 13px; color: var(--fg3); height: 18px; }
.tag .think .dot { width: 5px; height: 6px; }
.tag .reply { display: flex; align-items: center; gap: 6px; padding: 4px 8px; border-radius: 6px; background: var(--surface); border: 1px solid var(--line); font-size: 13.5px; line-height: 19px; min-height: 29px; }
.tag .reply .ph { color: var(--fg3); }
.tag .reply .tx { flex: 1; color: var(--fg); position: relative; }
.tag .reply.focus { border-color: color-mix(in srgb, var(--indigo) 55%, var(--line)); }
.tag .reply svg { width: 13px; height: 13px; flex: none; }
.tag .acts { display: flex; align-items: center; gap: 12px; font-size: 12px; color: var(--fg3); white-space: nowrap; }
.tag .acts .grow { flex: 1; }
.tag .acts span { border-radius: 4px; }
.tag .acts .pri { color: var(--fg); font-weight: 600; }
.tag .acts .hov { color: var(--fg); background: var(--chip); box-shadow: 0 0 0 4px var(--chip); }
.tag .sk svg { width: 100%; height: auto; display: block; overflow: visible; }
.tag .sk text { font-family: "Figtree"; font-variant-numeric: tabular-nums; }
.tag .capt { display: flex; align-items: center; gap: 8px; font-size: 12px; line-height: 16px; color: var(--fg2); margin-top: 2px; }
.tag .capt .sn { color: var(--fg3); flex: none; }
.tag .capt .gr { flex: 1; }
.tag .capt i { font-style: normal; color: var(--fg3); flex: none; width: 14px; text-align: center; }

/* selection toolbar and the ask box (after `toolbar` and `ask_box`) */
.card { position: absolute; background: var(--raised); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 8px 24px -6px rgba(0,0,0,.14); }
.tbar { width: 196px; padding: 5px 0; font-size: 13px; }
.tbar .row { display: flex; gap: 1px; padding: 0 5px; }
.tbar .row span { min-width: 24px; height: 24px; display: grid; place-items: center; border-radius: 5px; color: var(--fg2); font-size: 12px; padding: 0 3px; }
.tbar .sw { display: flex; gap: 6px; padding: 6px 10px 2px; }
.tbar .sw i { width: 12px; height: 12px; border-radius: 50%; }
.tbar hr { border: 0; border-top: 1px solid var(--line); margin: 5px 8px; }
.tbar .act { display: flex; flex-direction: column; padding: 5px 10px; margin: 0 5px; border-radius: 6px; }
.tbar .act b { font-weight: 500; color: var(--fg); display: flex; justify-content: space-between; }
.tbar .act b kbd { font-size: 10px; }
.tbar .act small { font-size: 11.5px; color: var(--fg3); }
.tbar .act.hov { background: var(--chip); }
.askbox { width: 306px; padding: 10px 12px; font-size: 14px; }
.askbox .q { display: flex; align-items: center; gap: 7px; min-height: 22px; }
.askbox .q .ph { color: var(--fg3); }
.askbox .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.askbox .chip { display: flex; align-items: center; gap: 5px; padding: 3px 8px; border-radius: 999px; border: 1px solid var(--line); font-size: 12.5px; color: var(--fg2); background: var(--raised); }
.askbox .chip.on { color: var(--fg); }
.askbox .hint { margin-top: 8px; font-size: 12px; color: var(--fg3); }

/* chat (after `chat_panel`) */
.chatp { position: absolute; top: 46px; right: 0; bottom: 0; width: 340px; background: var(--surface); border-left: 1px solid var(--line); display: flex; flex-direction: column;
  box-shadow: -18px 0 40px -30px rgba(var(--shadow), .5); }
.chatp header { display: flex; align-items: flex-start; gap: 8px; padding: 14px 16px 10px; }
.chatp header .ti { flex: 1; min-width: 0; }
.chatp header .nm { display: flex; align-items: center; gap: 6px; font-size: 14px; }
.chatp header small { display: block; margin-top: 3px; font-size: 10.5px; color: var(--fg3); }
.chatp header .gb { font-size: 12px; color: var(--fg3); }
.chatp .log { flex: 1; padding: 6px 16px; display: flex; flex-direction: column; gap: 14px; overflow: hidden; }
.chatp .hello { font-size: 16px; line-height: 23px; }
.chatp .pills { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
.chatp .pills span { padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); font-size: 12px; color: var(--fg2); }
.chatp .me { align-self: flex-end; max-width: 250px; padding: 6px 10px; border-radius: 10px; background: var(--shelf); font-size: 13px; line-height: 18px; }
.chatp .ans { font-size: 14px; line-height: 20px; }
.chatp .ans p { margin: 0; } .chatp .ans p + p { margin-top: 10px; }
.chatp footer { border-top: 1px solid var(--line); padding: 10px 14px; display: flex; align-items: center; gap: 8px; font-size: 13px; }
.chatp footer .tx { flex: 1; position: relative; }
.chatp footer .ph { color: var(--fg3); }
.chatp footer .send { width: 22px; height: 22px; border-radius: 50%; background: var(--fg); display: grid; place-items: center; }
.chatp footer .send svg { width: 12px; height: 12px; }
.icaret { display: inline-block; width: 1.5px; height: 1.05em; background: var(--fg); vertical-align: -0.16em; margin-left: 1px; }

/* the mind menu (after `menus`) */
.menu { width: 230px; padding: 5px; font-size: 13px; }
.menu .mi { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 6px; color: var(--fg); }
.menu .mi small { margin-left: auto; color: var(--fg3); font-size: 11.5px; }
.menu .mi.hov { background: var(--chip); }
.menu .lab { font-size: 11.5px; color: var(--fg3); padding: 6px 8px 2px; }

/* ---------- the pointer, in screen space ---------- */
#cursor { position: absolute; left: 0; top: 0; width: 28px; height: 36px; pointer-events: none; transform-origin: 0 0; }
#cursor svg { position: absolute; left: 0; top: 0; overflow: visible; }

/* ---------- cold open and close ---------- */
.layer { position: absolute; inset: 0; pointer-events: none; }
#open .wm { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
#open .wm svg { display: block; overflow: visible; }
#open .tag-line, #close .line { position: absolute; left: 0; right: 0; text-align: center; font-size: 40px; font-weight: 400; color: var(--fg2); letter-spacing: -.005em; }
#keys { position: absolute; left: 0; right: 0; bottom: 64px; display: none; justify-content: center; align-items: center; gap: 10px; }
#keys .key { min-width: 64px; height: 64px; padding: 0 16px; display: grid; place-items: center; border-radius: 12px; font: 500 30px/1 "Figtree"; color: var(--fg);
  background: var(--raised); border: 1px solid var(--line2); box-shadow: 0 4px 0 var(--line2), 0 14px 30px -14px rgba(var(--shadow), .5); }
#keys .key.down { transform: translateY(3px); box-shadow: 0 1px 0 var(--line2), 0 10px 24px -14px rgba(var(--shadow), .5); }
#keys .kl { margin-left: 8px; font-size: 26px; color: var(--fg2); }
#fade { position: absolute; inset: 0; background: #0B0A0C; opacity: 0; pointer-events: none; }
#close .icon { position: absolute; left: 50%; top: 262px; width: 300px; height: 300px; margin-left: -150px; transform-origin: 50% 60%; }
#close .icon img { width: 100%; height: 100%; display: block; }
#close .wm { position: absolute; left: 50%; top: 600px; height: 104px; transform: translateX(-50%); }
#close .line { top: 752px; font-size: 34px; }

/* ---------- captions: plain words on the linen, one line ---------- */
#caps { position: absolute; left: 120px; top: 50px; right: 120px; height: 70px; }
.cap { position: absolute; left: 0; top: 0; white-space: nowrap; font-size: 38px; line-height: 50px; font-weight: 500; letter-spacing: -.012em; color: var(--fg); }
.cap .u { position: relative; }
.cap svg { position: absolute; left: 0; top: 0; overflow: visible; }

/* ---------- hide threads: every mark lifts off together ---------- */
.marks { will-change: auto; }
</style>
</head>
<body>
<div id="stage">
  <div id="world">
    <div class="desk" id="desk"></div>
    <div class="desk" id="desk-dark"></div>
    <div class="win" id="win">
      <div class="tb">
        <div class="lights"><i></i><i></i><i></i></div>
        <svg class="tb-menu" viewBox="0 0 20 20"><path d="M3 5.5h14M3 10h14M3 14.5h14" style="stroke:var(--fg2);stroke-width:1.5;stroke-linecap:round;fill:none"/></svg>
        <div class="tb-wm" id="tb-wm"></div>
        <div class="chat-btn" id="chat-btn"><span class="dot"></span>Chat</div>
      </div>
      <aside class="side" id="side"></aside>
      <div class="pagearea">
        <div class="desk" id="desk-in"></div>
        <div class="desk" id="desk-in-dark"></div>
        <div class="sheet" id="sheet">
          <div class="nh" id="nh"></div>
          <div class="briefline" id="briefline"></div>
          <div class="vp" id="vp">
            <div class="content" id="content">
              <div class="band" id="band"><svg id="band-svg"></svg><span class="count" id="band-count"></span></div>
              <h1 class="n-title" id="n-title"></h1>
              <div class="rows" id="rows"></div>
              <div class="mg" id="mg"></div>
              <svg class="ov" id="ov"></svg>
              <div class="caret" id="caret"></div>
              <div id="cards"></div>
            </div>
          </div>
        </div>
      </div>
      <aside class="chatp" id="chat"></aside>
      <div id="wincards"></div>
    </div>
  </div>
  <div id="vignette"></div>
  <div class="layer" id="open"><div class="wm" id="open-wm"></div><div class="tag-line" id="open-line">A notebook that asks.</div></div>
  <div class="layer" id="close"><div class="icon" id="close-icon"><img src="../directions/assets/threads/icon.svg" alt=""></div><div class="wm" id="close-wm"></div><div class="line" id="close-line">Runs on your Claude. Lives on your Mac.</div></div>
  <div id="caps"></div>
  <div id="keys"></div>
  <div id="fade"></div>
  <div id="cursor"></div>
</div>
<script src="data/assets.js"></script>
<script src="data/real.js"></script>
<script src="film.js"></script>
<script src="audio.js"></script>
</body>
</html>
