<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 300">
<g data-step="1" data-caption="Time runs left to right; counter resets at 1:00.">
<path d="M20 70 Q160 68 300 70" stroke="ink" stroke-width="1.4" fill="none"/>
<line x1="40" y1="64" x2="40" y2="76" stroke="ink" stroke-width="1.2"/>
<line x1="160" y1="56" x2="160" y2="84" stroke="ink" stroke-width="1.6"/>
<line x1="280" y1="64" x2="280" y2="76" stroke="ink" stroke-width="1.2"/>
<text x="40" y="94" class="sans" font-size="11" fill="graphite" text-anchor="middle">0:00</text>
<text x="160" y="98" class="sans" font-size="11" fill="ink" text-anchor="middle">1:00</text>
<text x="280" y="94" class="sans" font-size="11" fill="graphite" text-anchor="middle">2:00</text>
<text x="160" y="46" class="voice" font-size="14" fill="ink" text-anchor="middle">reset</text>
<text x="100" y="30" class="sans" font-size="10" fill="faint" text-anchor="middle">minute 1</text>
<text x="220" y="30" class="sans" font-size="10" fill="faint" text-anchor="middle">minute 2</text>
</g>
<g data-step="2" data-caption="100 requests at 0:59 fill minute 1's counter.">
<rect x="128" y="112" width="28" height="70" fill="wash" stroke="ink" stroke-width="1.2"/>
<text x="142" y="200" class="sans" font-size="10" fill="graphite" text-anchor="middle">0:59</text>
<text x="96" y="150" class="voice" font-size="15" fill="ink" text-anchor="middle">100</text>
</g>
<g data-step="3" data-caption="Counter resets, so 100 more at 1:00 pass too.">
<rect x="164" y="112" width="28" height="70" fill="wash" stroke="ink" stroke-width="1.2"/>
<text x="178" y="200" class="sans" font-size="10" fill="graphite" text-anchor="middle">1:00</text>
<text x="224" y="150" class="voice" font-size="15" fill="ink" text-anchor="middle">100</text>
</g>
<g data-step="4" data-caption="200 requests in about two seconds, not 100.">
<path d="M124 216 Q160 232 196 216" stroke="ink" stroke-width="1.4" fill="none"/>
<text x="160" y="252" class="voice" font-size="20" fill="ink" text-anchor="middle">200 in ~2s</text>
<text x="160" y="276" class="sans" font-size="11" fill="graphite" text-anchor="middle">caps calendar minutes, not any 60s</text>
</g>
</svg>