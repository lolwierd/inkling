<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 380"><g data-step="1" data-caption="Two fixed one-minute windows meet at the boundary."><path d="M20 70 Q160 68 300 70" stroke="ink" stroke-width="1.4" fill="none"/><line x1="160" y1="40" x2="160" y2="365" stroke="faint" stroke-width="1"/><text x="90" y="55" fill="ink" class="voice" font-size="15" text-anchor="middle">minute 1</text><text x="230" y="55" fill="ink" class="voice" font-size="15" text-anchor="middle">minute 2</text><text x="160" y="88" fill="graphite" class="sans" font-size="10" text-anchor="middle">12:01:00</text></g><g data-step="2" data-caption="100 requests land in the last second of minute 1."><rect x="140" y="110" width="18" height="20" fill="wash" stroke="ink" stroke-width="1.2"/><text x="132" y="124" fill="ink" class="voice" font-size="13" text-anchor="end">100 reqs at 12:00:59</text><text x="132" y="146" fill="graphite" class="sans" font-size="10" text-anchor="end">counter = 100, allowed</text></g><g data-step="3" data-caption="At the minute mark the counter resets to zero."><path d="M160 168 Q172 185 160 205" stroke="ink" stroke-width="1.3" fill="none"/><path d="M155 198 L160 205 L166 199" stroke="ink" stroke-width="1.3" fill="none"/><text x="176" y="192" fill="ink" class="voice" font-size="14">reset to 0</text></g><g data-step="4" data-caption="100 more requests land in the first second of minute 2."><rect x="162" y="230" width="18" height="20" fill="wash" stroke="ink" stroke-width="1.2"/><text x="188" y="244" fill="ink" class="voice" font-size="13">100 reqs at 12:01:00</text><text x="188" y="266" fill="graphite" class="sans" font-size="10">counter = 100, allowed</text></g><g data-step="5" data-caption="200 requests pass within two seconds, double the limit."><path d="M140 290 Q140 300 150 300 L170 300 Q180 300 180 290" stroke="ink" stroke-width="1.4" fill="none"/><line x1="160" y1="300" x2="160" y2="310" stroke="ink" stroke-width="1.4"/><text x="160" y="330" fill="ink" class="voice" font-size="17" text-anchor="middle">200 requests in 2 seconds</text><text x="160" y="350" fill="graphite" class="sans" font-size="10" text-anchor="middle">not "never more than 100 in any 60s"</text></g></svg>