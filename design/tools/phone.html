<!DOCTYPE html><html><head><meta charset="utf-8"><style>body{margin:0;background:#7a7a7a}iframe{width:390px;border:0;display:block;background:#fff}pre{font:11px/1.4 monospace;white-space:pre-wrap;margin:0;padding:8px;background:#fff}</style></head>
<body><iframe id="f"></iframe><pre id="out">waiting</pre>
<script>
// Headless Chrome will not make a window narrower than 500 px, so phone-width checks
// load the page in a 390 px iframe. ?src=<file url>&h=<iframe height>&wait=<ms>
const q = new URLSearchParams(location.search);
const f = document.getElementById("f");
f.style.height = (q.get("h") || 844) + "px";
f.src = q.get("src");
f.onload = () => setTimeout(() => {
  try {
    const d = f.contentDocument, pre = d && d.getElementById("qa");
    document.getElementById("out").textContent = pre ? pre.textContent : "no #qa (add qa=1 to src)";
  } catch (e) { document.getElementById("out").textContent = "blocked: " + e; }
}, +(q.get("wait") || 2500));
</script></body></html>
