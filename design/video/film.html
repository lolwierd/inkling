<title>Inkling · walkthrough film</title>
<!-- The film is one page. Every frame is renderAt(t), a pure function of time, so headless
     Chrome can render any frame in any order (render.ts splits the frames across workers).
     Open it in a browser to look: ?t=<seconds> holds one frame, ?play plays it (no sound).
     app.js rebuilds the app (src/ as of 6 Nov 2026), film.js is the cut, audio.js the score. -->
