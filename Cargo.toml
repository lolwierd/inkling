[package]
name = "inkling"
version = "0.1.2"
edition = "2024"
description = "A local notebook that thinks with you, in the margin."
publish = false

[dependencies]
gpui-kit = { version = "0.9.0", features = ["speech"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
unicode-segmentation = "1"
roxmltree = "0.20"
svgtypes = "0.15"
log = "0.4"
env_logger = "0.11"
smallvec = "1"
async-channel = "2"

# GPUI's Apple backend compiles its Metal shaders with `xcrun metal` at build
# time, which needs full Xcode. `runtime_shaders` compiles them when the app
# starts instead, so the Command Line Tools are enough.
[target.'cfg(target_os = "macos")'.dependencies]
gpui_macos = { package = "gpui-pre-macos", version = "=0.3.11", features = ["runtime_shaders"] }
# The Dock icon follows the system's appearance (src/dock.rs): one AppKit call, through
# the same objc crate GPUI's Apple backend already builds.
objc = "0.2"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
